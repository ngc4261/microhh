# Fiedler-type vortex in a rotating box: a prescribed updraft column ([force]
# swvortexforce) in an f-plane (fc, no geostrophic wind) draws in angular
# momentum and spins up a tornado-like vortex at the surface. Not a supercell
# tornado: there is no storm, only the forced updraft. 10 km x 10 km x 3.2 km,
# 39 m x 39 m x 25 m, 30 min. Precipitation loading and cs=1.2 are the options
# added for the weisman_klemp comparison with CM1 (both switched on here).
[master]
npx=1
npy=1

[grid]
itot=256
jtot=256
ktot=128

xsize=10000.
ysize=10000.
zsize=3200.

swspatialorder=2

[advec]
swadvec=2i62
cflmax=1.2

[diff]
swdiff=smag2
dnmax=0.3
cs=1.2

[thermo]
swbasestate=anelastic
swthermo=moist
pbot=100000.
thvref0=300
swupdatebasestate=0
swprecipbuoyancy=true

[micro]
swmicro=nsw6
cflmax=1.2
Nc0=250e6

[force]
swlspres=geo
fc=0.004
swvortexforce=true
vf_amp=0.15
vf_r=1000.
vf_zb=300.
vf_zt=2800.

[boundary]
mbcbot=noslip
mbctop=freeslip
sbcbot=flux
sbctop=flux
sbot=0
stop=0
sbot[thl]=0
stop[thl]=0
sbot[qt]=0
stop[qt]=0
swboundary=surface
z0m=0.01
z0h=0.01

[fields]
visc=1.e-5
svisc=1.e-5

rndseed=2
rndamp[thl]=0.1
rndamp[qt]=0
rndz=300.
rndexp=2.

[buffer]
swbuffer=1
zstart=2800
sigma=0.00223
beta=2.

[time]
starttime=0
endtime=1800
dt=1.
dtmax=5
savetime=1800
outputiter=20
adaptivestep=true
rkorder=4

[stats]
swstats=0

[cross]
swcross=1
sampletime=30
crosslist=w,u,v,qlqi
xy=50,500
xz=5000

[dump]
swdump=1
sampletime=60
dumplist=qlqi,w

[limiter]
limitlist=qt,qr
